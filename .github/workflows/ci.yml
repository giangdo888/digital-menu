name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore DigitalMenu.sln

    - name: Build Code
      run: dotnet build DigitalMenu.sln --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test DigitalMenu.sln --no-build --configuration Release --verbosity normal

    - name: Publish application
      run: dotnet publish DigitalMenuApi/DigitalMenuApi.csproj --no-restore --configuration Release --output ./publish

    - name: Upload publish artifact
      uses: actions/upload-artifact@v4
      with:
        name: digital-menu-api
        path: ./publish

  deploy:
    needs: build_and_test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - name: Download publish artifact
      uses: actions/download-artifact@v4
      with:
        name: digital-menu-api
        path: ./publish

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish

  frontend_build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint frontend
      run: npm run lint

    - name: Build frontend
      env:
        NEXT_PUBLIC_API_URL: ${{ secrets.AZURE_API_URL }}
      run: npm run build

    - name: Prepare deployment package
      run: |
        mkdir frontend-deploy
        cp -r .next public node_modules package.json package-lock.json frontend-deploy/

    - name: Upload frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: digital-menu-frontend
        path: frontend/frontend-deploy

  frontend_deploy:
    needs: frontend_build
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - name: Download frontend artifact
      uses: actions/download-artifact@v4
      with:
        name: digital-menu-frontend
        path: ./frontend-deploy

    - name: Deploy frontend to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_FRONTEND_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
        package: ./frontend-deploy
